social_vlm_interaction:
  ros__parameters:
    # Keep the VLM opt-in: Block B's RGB-D/YOLO tracking never depends on it.
    use_sim_time: true
    enable_vlm: true

    # These inputs originate in one Block-B RGB callback and share its stamp.
    rgb_topic: /camera/color/image_raw
    observations_topic: /people_observations
    people_topic: /people/tracks
    # Output: VlmPersonStates — one VlmPersonState per visible track.
    # Each state carries track_id, person_id (for semantic_fusion join), color, and state.
    states_topic: /social_perception/vlm_person_states
    # Newest labelled frame sent to Qwen; subscribe via rqt_image_view to debug.
    labelled_scene_topic: /social_perception/vlm_input_image

    # The adapter was trained from an Unsloth pre-quantized Qwen base. The node
    # opens adapter_config.json with FastVisionModel, so both adapter and base
    # must already exist locally; the node never downloads at runtime.
    vlm_adapter_path: Saved_Model
    vlm_base_model: unsloth/Qwen2-VL-2B-Instruct-bnb-4bit
    vlm_load_in_4bit: true
    vlm_require_cuda: true
    # Keep every FP4/NF4 visual-merger layer on one GPU; do not CPU-offload it.
    vlm_device: cuda:0
    # 64 tokens is enough for a few JSON objects (color + state pairs).
    vlm_max_new_tokens: 64
    vlm_min_pixels: 3136       # 56 * 56  — minimum resolution per frame patch
    vlm_max_pixels: 50176      # 64 * 28 * 28  (quartered from original 200704, ~20% faster)

    # A rolling four-frame scene is inferred at most once per inference cycle.
    # Block B continues at its normal rate while Qwen works in another thread.
    vlm_frame_count: 4
    # Four frames at 0.5 s spacing span 1.5 s from oldest to newest.
    vlm_frame_interval_s: 0.5
    sync_cache_size: 12

    # Prompt asks for numeric ID (from the bounding box label "ID <n> (<color>)") and state.
    # The parser handles both "ID" and "id" keys, and falls back to color if needed.
    state_prompt: >
      You are given 4 sequential images from the same short video clip in temporal order (frame 1 → frame 4).\nEach person has a bounding box labeled "ID <number> (<color>)".\nExamine all 4 images together as one temporal sequence.\nAssign exactly one state to each person.\nSTATE DEFINITIONS\n- "crossing": moving laterally across the robot forward path.\n- "approaching": moving toward the robot from the opposite direction.\n- "straight": moving in the same direction as the robot, ahead of it.\n- "talking": interacting or conversing with another person.\nDetermine the state from movement trajectory across the sequence, not from a single frame.\nReturn ONLY a JSON array. Each object must have "ID" (integer from the label, e.g. 1 or 2) and "state".\nExample: [{"ID": 1, "state": "talking"}, {"ID": 2, "state": "crossing"}]
